# schematize-web — workflow de CI de referência (§43, §44, §45, §48, §35).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack
# (Next.js ou Astro). Mobile primeiro; a11y e Core Web Vitals são GATE.
name: ci
# Gatilho (piso 27 da engineering): CI remoto NÃO roda por commit nem por PR. O gate por commit é LOCAL
# (pre-commit + scripts/check-*.sh). Este workflow roda só em dispatch manual e em tag de promoção (hml-*, v*).
on:
  workflow_dispatch: {}
  push:
    tags: ['hml-*', 'v*']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  standards-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Gate de padrões de frontend (DoD/§37) no diff
        # Base = tag anterior (ou 1º commit): é o que se acumulou desde a última promoção. Nunca HEAD...HEAD.
        run: |
          BASE="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          bash .claude/skills/schematize-web/scripts/check-diff.sh "$BASE"
      - name: Gatilhos de CI deste repo (piso 27)
        run: bash .claude/skills/schematize-web/scripts/check-ci-triggers.sh .
      - name: Índice de componentes/hooks atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './src' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-web/scripts/check-index.sh
      - name: Scan de segredo no archive (§43/§28)
        run: bash .claude/skills/schematize-web/scripts/archive-secret-scan.sh .

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # A versao vem do repo (.nvmrc), nao de 'lts/*' movel: o CI tem de rodar na MESMA
        # versao do dev. O numero da LTS corrente vive no anexo volatil da skill.
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck (TS strict — §40)
        run: npx tsc --noEmit
      - name: Lint (a11y + security + fronteiras — §44/§43)
        run: npx eslint .
      - name: Unit + componente (Testing Library — §48)
        run: npm test -- --run
      - name: Build (Next/Astro)
        run: npm run build
      - name: Gera sitemap (autogerado — §46)
        run: node .claude/skills/schematize-web/scripts/gen-sitemap.mjs --base "${SITE_BASE_URL:-https://example.com}" --out ./out > ./out/sitemap.xml
      - name: Smoke self-check (anti verde-mentiroso — §48)
        run: bash .claude/skills/schematize-web/scripts/smoke-selfcheck.sh --self-check

  e2e-a11y:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # A versao vem do repo (.nvmrc), nao de 'lts/*' movel: o CI tem de rodar na MESMA
        # versao do dev. O numero da LTS corrente vive no anexo volatil da skill.
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps
      - name: E2E (Playwright — fluxos críticos, §48)
        run: npx playwright test
      - name: A11y axe (GATE — §44; zero violação séria/crítica)
        run: npm run test:a11y

  lighthouse-cwv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # A versao vem do repo (.nvmrc), nao de 'lts/*' movel: o CI tem de rodar na MESMA
        # versao do dev. O numero da LTS corrente vive no anexo volatil da skill.
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci && npm run build
      - name: Lighthouse CI (GATE de Core Web Vitals + budgets — §45)
        run: |
          # @lhci/cli entra como devDependency PINADA (npm i -D @lhci/cli@0.15.1); nada de install -g sem versão.
          # lighthouserc define assert: LCP<2500, total-blocking-time/INP, CLS<0.1,
          # e resource budgets. Falha o job se estourar (não use --upload sem assert).
          npx lhci autorun || (echo "Lighthouse/CWV fora do budget — bloqueia (§45)"; exit 1)

  visual-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # A versao vem do repo (.nvmrc), nao de 'lts/*' movel: o CI tem de rodar na MESMA
        # versao do dev. O numero da LTS corrente vive no anexo volatil da skill.
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Regressão visual (telas-chave — §48)
        run: npx playwright test --grep @visual

  dep-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: npm audit (higiene de dependência — §43.7)
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks (em org exige GITLEAKS_LICENSE; sem licença, troque por `gitleaks detect` do binário)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
